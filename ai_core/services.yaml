# Catálogo de serviços da clínica — base do recomendador content-based (C4)
# tags: vocabulário compartilhado com o contexto do pet (ver recommender.py)

services:
  - code: CONSULTA_CLINICA
    name: Consulta clínica presencial
    description: Avaliação completa com médico-veterinário, exame físico e anamnese.
    price_brl: 180
    species: [dog, cat]
    tags: [telemetria, risco_alto, risco_critico, febre, cardiaco, respiratorio, atividade, checkup, adulto, senior, filhote]

  - code: TELECONSULTA
    name: Teleconsulta de triagem
    description: Conversa por vídeo com veterinário para avaliar sinais e decidir próximos passos.
    price_brl: 90
    species: [dog, cat]
    tags: [telemetria, risco_moderado, atividade, engajamento_baixo, conveniencia]

  - code: HEMOGRAMA
    name: Exames laboratoriais (hemograma + bioquímico)
    description: Painel sanguíneo para investigar alterações sistêmicas.
    price_brl: 220
    species: [dog, cat]
    tags: [risco_alto, risco_critico, febre, senior, checkup]

  - code: CARDIO
    name: Avaliação cardiológica (ECG + ausculta)
    description: Investigação de alterações de ritmo e frequência cardíaca.
    price_brl: 260
    species: [dog, cat]
    tags: [cardiaco, senior, risco_alto, risco_critico]

  - code: RESPIRATORIO
    name: Avaliação respiratória (oximetria + raio-X de tórax)
    description: Investigação de queda de saturação e esforço respiratório.
    price_brl: 240
    species: [dog, cat]
    tags: [respiratorio, risco_alto, risco_critico]

  - code: VACINACAO
    name: Vacinação (dose de reforço)
    description: Aplicação de vacina conforme protocolo da espécie.
    price_brl: 95
    species: [dog, cat]
    tags: [vacina, rotina]

  - code: VERMIFUGACAO
    name: Vermifugação
